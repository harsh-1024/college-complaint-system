name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main", "master"]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static bundle
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SERVER_BASE_URL: ${{ vars.SERVER_BASE_URL }}
        run: |
          set -e
          mkdir -p dist
          cp -r frontend/* dist/
          touch dist/.nojekyll

          if [ "$REPO_NAME" = "$REPO_OWNER.github.io" ]; then
            SITE_URL="https://$REPO_OWNER.github.io"
          else
            SITE_URL="https://$REPO_OWNER.github.io/$REPO_NAME"
          fi

          sed -i "s|https://YOUR_USERNAME.github.io/YOUR_REPO|$SITE_URL|g" dist/robots.txt dist/sitemap.xml

          if [ -n "$API_BASE_URL" ]; then
            sed -i "s|API_BASE: \"\"|API_BASE: \"$API_BASE_URL\"|g" dist/config.js
          fi

          if [ -n "$SERVER_BASE_URL" ]; then
            sed -i "s|SERVER_BASE: \"\"|SERVER_BASE: \"$SERVER_BASE_URL\"|g" dist/config.js
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


